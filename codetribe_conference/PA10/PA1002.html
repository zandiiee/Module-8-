<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <canvas id="myCanva" width="300" height="100" style="border: 1px solid black"></canvas>

    <script>
        const mycanva = document.getElementById("myCanva")
        const ctx = mycanva.getContext("2d")

        // Draw rectangle

        ctx.fillStyle = "pink"
        ctx.fillRect (0, 0, 150, 75)

        ctx.beginPath()
        ctx.arc (95, 50, 40, 0, 2 *Math.PI, false);
        ctx.fillStyle = "black"
        ctx.fill(); 
        ctx.stroke()

    </script>

</body>
</html>
